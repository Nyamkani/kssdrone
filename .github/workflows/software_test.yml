name: ESP Software Test
on:
  workflow_call:
  push:
    branches:
      - v1.3
permissions:
  contents: read
env:
  ENABLE_COVERAGE: 'true'
  ARTIFACT_RETENTION_DAYS: '30'
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build gcovr
      - name: Build host tests
        run: |
          cmake -S ci/tests -B host-build -G Ninja -DENABLE_COVERAGE="$ENABLE_COVERAGE"
          cmake --build host-build
          mkdir -p ci-reports/software
      - name: Unit tests
        if: success() || failure()
        run: ctest --test-dir host-build -L '^unit$' --output-on-failure --no-tests=error --output-junit "$PWD/ci-reports/software/unit.xml"
      - name: Integration tests
        if: success() || failure()
        run: ctest --test-dir host-build -L '^integration$' --output-on-failure --no-tests=error --output-junit "$PWD/ci-reports/software/integration.xml"
      - name: Regression tests
        if: success() || failure()
        run: ctest --test-dir host-build -L '^regression$' --output-on-failure --no-tests=error --output-junit "$PWD/ci-reports/software/regression.xml"
      - name: Software-in-the-loop model
        if: success() || failure()
        run: ctest --test-dir host-build -L '^simulation$' --output-on-failure --no-tests=error --output-junit "$PWD/ci-reports/software/simulation.xml"
      - name: Code coverage
        if: (success() || failure()) && env.ENABLE_COVERAGE == 'true'
        run: |
          gcovr --root . --filter 'main/' host-build --xml ci-reports/software/coverage.xml
          gcovr --root . --filter 'main/' host-build --html-details ci-reports/software/coverage.html
          gcovr --root . --filter 'main/' host-build | tee ci-reports/software/coverage.txt
      - name: Upload software test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: software-tests-${{ github.sha }}
          path: ci-reports/software/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
