name: ESP Firmware CI

# ============================================================
# 1. Project configuration
# ============================================================
on:
  workflow_call:
  push:
    branches:
      - v1.3

env:
  IDF_VERSION: v6.0
  PROJECT_NAME: esp32s3-drone
  TARGET_MCU: esp32s3
  ARTIFACT_NAME: kssdrone-esp32s3
  PROJECT_DIR: .
  BUILD_DIR: build
  SDKCONFIG_FILE: sdkconfig
  ARTIFACT_RETENTION_DAYS: '30'
  ENABLE_MEMORY_ANALYSIS: 'true'
  ENABLE_STATIC_ANALYSIS: 'true'
  ENABLE_CODE_STYLE: 'true'

permissions:
  contents: read

jobs:
  firmware-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # ========================================================
    # 2. Common implementation
    # ========================================================
    steps:
      - name: Check runner environment
        run: |
          cat /etc/os-release
          uname -a
          lscpu
          free -h
          df -h
          docker --version

      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check source and target configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git log -1 --oneline
          git rev-parse HEAD
          test -f CMakeLists.txt
          test -f "$SDKCONFIG_FILE"
          grep -Fx "CONFIG_IDF_TARGET=\"$TARGET_MCU\"" "$SDKCONFIG_FILE"

      - name: Prepare ESP-IDF environment
        run: docker pull "espressif/idf:$IDF_VERSION"

      - name: Check ESP-IDF version
        run: docker run --rm "espressif/idf:$IDF_VERSION" idf.py --version

      - name: Build firmware
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "espressif/idf:$IDF_VERSION" \
            idf.py -B "/project/$BUILD_DIR" \
              -D "SDKCONFIG=/project/$SDKCONFIG_FILE" \
              -D "IDF_TARGET=$TARGET_MCU" build

      - name: Verify build artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -s "$BUILD_DIR/$PROJECT_NAME.bin"
          test -s "$BUILD_DIR/$PROJECT_NAME.elf"
          test -s "$BUILD_DIR/$PROJECT_NAME.map"
          test -s "$BUILD_DIR/bootloader/bootloader.bin"
          test -s "$BUILD_DIR/partition_table/partition-table.bin"
          test -s "$BUILD_DIR/flasher_args.json"
          test -s "$BUILD_DIR/flash_args"
          ls -lh "$BUILD_DIR/$PROJECT_NAME".{bin,elf,map}

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.sha }}
          path: |
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}.bin
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}.elf
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}.map
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/bootloader/bootloader.bin
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/partition_table/partition-table.bin
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/flasher_args.json
            ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/flash_args
            ${{ env.PROJECT_DIR }}/${{ env.SDKCONFIG_FILE }}
            ${{ env.PROJECT_DIR }}/dependencies.lock
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Memory analysis
        if: env.ENABLE_MEMORY_ANALYSIS == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -v "$GITHUB_WORKSPACE/tools/ci:/ci-tools:ro" \
            -v "$GITHUB_WORKSPACE/config/ci:/ci-config:ro" \
            -w /project \
            "espressif/idf:$IDF_VERSION" \
            bash /ci-tools/memory_analysis.sh \
              "$BUILD_DIR" "$PROJECT_NAME" "$SDKCONFIG_FILE" \
              /ci-config/memory_limits.env "$TARGET_MCU"

      - name: Upload memory analysis reports
        if: always() && env.ENABLE_MEMORY_ANALYSIS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: memory-analysis-${{ github.sha }}
          path: ${{ env.PROJECT_DIR }}/${{ env.BUILD_DIR }}/reports/memory/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Report CI result
        if: always()
        env:
          CI_RESULT: ${{ job.status }}
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "ESP-IDF: $IDF_VERSION"
          echo "Target: $TARGET_MCU"
          echo "Project: $PROJECT_NAME"
          echo "CI Result: $CI_RESULT"


  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Cppcheck
        if: env.ENABLE_STATIC_ANALYSIS == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Run static analysis
        if: env.ENABLE_STATIC_ANALYSIS == 'true'
        run: bash tools/ci/static_analysis.sh
      - name: Upload static analysis report
        if: always() && env.ENABLE_STATIC_ANALYSIS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: static-analysis-${{ github.sha }}
          path: ci-reports/static/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  code-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install clang-format
        if: env.ENABLE_CODE_STYLE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting (no source modification)
        if: env.ENABLE_CODE_STYLE == 'true'
        run: bash tools/ci/style_check.sh
      - name: Upload style report
        if: always() && env.ENABLE_CODE_STYLE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: code-style-${{ github.sha }}
          path: ci-reports/style/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
